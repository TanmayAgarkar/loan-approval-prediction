<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Loan Approval Prediction
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

<div class="page">

    <div class="container">

        <div class="header">

            <div>

                <p class="eyebrow">
                    MACHINE LEARNING
                </p>

                <h1>
                    Loan Approval
                    Prediction
                </h1>

                <p class="subtitle">
                    Decision Tree Classification
                </p>

            </div>

            <div class="model-badge">
                Decision Tree
            </div>

        </div>


        <form
            action="/predict"
            method="POST"
        >

            <div class="section">

                <h2>
                    Applicant Information
                </h2>

                <div class="grid">

                    <div class="field">

                        <label>
                            Gender
                        </label>

                        <select
                            name="gender"
                            required
                        >

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label>
                            Married
                        </label>

                        <select
                            name="married"
                            required
                        >

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No">
                                No
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label>
                            Dependents
                        </label>

                        <select
                            name="dependents"
                            required
                        >

                            <option value="0">
                                0
                            </option>

                            <option value="1">
                                1
                            </option>

                            <option value="2">
                                2
                            </option>

                            <option value="3+">
                                3+
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label>
                            Education
                        </label>

                        <select
                            name="education"
                            required
                        >

                            <option value="Graduate">
                                Graduate
                            </option>

                            <option value="Not Graduate">
                                Not Graduate
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label>
                            Self Employed
                        </label>

                        <select
                            name="self_employed"
                            required
                        >

                            <option value="No">
                                No
                            </option>

                            <option value="Yes">
                                Yes
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label>
                            Property Area
                        </label>

                        <select
                            name="property_area"
                            required
                        >

                            <option value="Urban">
                                Urban
                            </option>

                            <option value="Semiurban">
                                Semiurban
                            </option>

                            <option value="Rural">
                                Rural
                            </option>

                        </select>

                    </div>

                </div>

            </div>


            <div class="section">

                <h2>
                    Financial Information
                </h2>

                <div class="grid">

                    <div class="field">

                        <label>
                            Applicant Income
                        </label>

                        <input
                            type="number"
                            name="applicant_income"
                            min="0"
                            step="0.01"
                            placeholder="e.g. 5000"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Co-applicant Income
                        </label>

                        <input
                            type="number"
                            name="coapplicant_income"
                            min="0"
                            step="0.01"
                            placeholder="e.g. 1500"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Loan Amount
                        </label>

                        <input
                            type="number"
                            name="loan_amount"
                            min="0"
                            step="0.01"
                            placeholder="e.g. 200"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Loan Term
                        </label>

                        <select
                            name="loan_term"
                            required
                        >

                            <option value="360">
                                360 months
                            </option>

                            <option value="180">
                                180 months
                            </option>

                            <option value="240">
                                240 months
                            </option>

                            <option value="300">
                                300 months
                            </option>

                            <option value="480">
                                480 months
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label>
                            Credit History
                        </label>

                        <select
                            name="credit_history"
                            required
                        >

                            <option value="1">
                                Good
                            </option>

                            <option value="0">
                                Poor
                            </option>

                        </select>

                    </div>

                </div>

            </div>


            <button
                type="submit"
                class="predict-button"
            >
                Predict Loan Approval
            </button>

        </form>


        {% if prediction %}

        <div class="result-card">

            <p class="result-label">
                PREDICTION RESULT
            </p>

            <h2>
                {{ prediction }}
            </h2>

            {% if probability is not none %}

            <div class="probability">

                <div class="probability-header">

                    <span>
                        Approval Probability
                    </span>

                    <strong>
                        {{ probability }}%
                    </strong>

                </div>

                <div class="progress">

                    <div
                        class="progress-bar"
                        style="width: {{ probability }}%;"
                    ></div>

                </div>

            </div>

            {% endif %}

        </div>

        {% endif %}

    </div>

</div>

</body>

</html>
